services:
  api:
    image: api-gosuslugi-backend:latest
    build:
      context: .
      dockerfile: ./api-gosuslugi-backend/Dockerfile
      args:
        progress: plain
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
    environment:
      - apikey=${apikey:-}
      - TSAAddress=${TSAAddress:-http://testca2012.cryptopro.ru/tsp/tsp.srf}
      - esia_host=${esia_host:-https://esia-portal1.test.gosuslugi.ru}
      - svcdev_host=${svcdev_host:-https://svcdev-gostapi.test.gosuslugi.ru}
      - KeyPin=${KeyPin:-}
      - production=${production}
      # Отдельное имя не позволяет старому legacy SERVICES из локального .env
      # незаметно подменить строгий versioned-каталог.
      - SERVICES=${SERVICES_OVERRIDE:-}
      - XML_ROOT=/xml
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:50080,http://127.0.0.1:50080}
      # Почта поддержки: заявки в УЦ и разбор ответов. Пароль приложения на
      # стенде берётся из .env, в проде провайдер секретов заменяется.
      - MAIL_IMAP_HOST=${MAIL_IMAP_HOST:-}
      - MAIL_IMAP_PORT=${MAIL_IMAP_PORT:-993}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-465}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-1}
      - MAIL_INBOX_DIR=/var/lib/epgu-mail
      - CERT_INBOX_DIR=/var/lib/epgu-mail
      - SECRET_PROVIDER=${SECRET_PROVIDER:-env}
      # Настройки, сохранённые из интерфейса. Живут на томе и важнее окружения.
      - SETTINGS_FILE=/var/lib/epgu-mail/settings.env
    ports:
      # Backend хранит токен/сертификат в памяти процесса и рассчитан на одного
      # оператора. По умолчанию он доступен только с локальной машины.
      - "127.0.0.1:${API_PORT:-55000}:5000"
    volumes:
      # Журнал входящих запросов пишет приёмник. Оператору нужна запись только
      # для очистки журнала между прогонами теста.
      - inbound-data:/var/lib/epgu-inbound
      # Вложения из писем УЦ и сертификаты, положенные руками.
      - mail-data:/var/lib/epgu-mail
    restart: always

  # Публичная точка входа: URL системы и URL для push сообщений, которые
  # указываются при регистрации ИС. Отдельный процесс без доступа к
  # сертификатам, маркеру доступа и методам подачи заявлений.
  inbound:
    image: api-gosuslugi-backend:latest
    build:
      context: .
      dockerfile: ./api-gosuslugi-backend/Dockerfile
    command: ["uvicorn", "inbound:app", "--host", "0.0.0.0", "--port", "5001"]
    environment:
      - IS_MNEMONIC=${IS_MNEMONIC:-}
      - INBOUND_PUBLIC_URL=${INBOUND_PUBLIC_URL:-}
      - INBOUND_MAX_BODY=${INBOUND_MAX_BODY:-1048576}
    ports:
      # Единственный порт, который смотрит наружу: сюда редиректится трафик
      # с внешнего адреса ИС.
      - "${INBOUND_PORT:-58080}:5001"
    volumes:
      - inbound-data:/var/lib/epgu-inbound
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: always

  frontend:
    image: api-gosuslugi-client
    build:
      context: ./api-gosuslugi-client
      dockerfile: ./Dockerfile
      args:
        progress: plain
        BACKEND_URL: "${BACKEND_URL:-/api}"
    container_name: react-nginx
    environment:
      - BACKEND_API=${BACKEND_API:-http://api:5000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-50080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  # Журнал входящих запросов: пишет приёмник, читает операторский API.
  inbound-data:
  # Вложения из почты и сертификаты, которые кладут в папку руками.
  mail-data:
