name: Предложение
description: Предложить новую функцию, поддержку услуги или улучшение существующего поведения.
title: "[Предложение]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу, которую нужно решить. Наличие услуги в официальном каталоге ещё не означает, что её можно включить в отправку: для этого нужны рабочий шаблон, XSD и проверка в соответствующем контуре.

        Не прикладывайте секреты и персональные данные.
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - backend (project/api-gosuslugi-backend)
        - frontend (project/api-gosuslugi-client)
        - Python SDK epgu-api (project/python-epgu)
        - база знаний / карточка TEST (project/knowledge)
        - MCP-сервер (project/mcp-server)
        - скрипты (project/scripts)
        - документация (project/docs)
        - другое или не знаю
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить
      description: Что вы пытаетесь сделать и что мешает сейчас.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Официальные источники
      description: Код услуги, ссылка на спецификацию в каталоге API Госуслуг и её версия, если применимо.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: В предложении нет секретов и персональных данных.
          required: true
