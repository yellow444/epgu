services:
  api:
    image: api-gosuslugi-backend:latest
    build:
      context: .
      dockerfile: ./api-gosuslugi-backend/Dockerfile
      args:
        progress: plain
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
    environment:
      - apikey=${apikey:-}
      - TSAAddress=${TSAAddress:-http://testca2012.cryptopro.ru/tsp/tsp.srf}
      - esia_host=${esia_host:-https://esia-portal1.test.gosuslugi.ru}
      - svcdev_host=${svcdev_host:-https://svcdev-gostapi.test.gosuslugi.ru}
      - KeyPin=${KeyPin:-}
      - production=${production}
      # Отдельное имя не позволяет старому legacy SERVICES из локального .env
      # незаметно подменить строгий versioned-каталог.
      - SERVICES=${SERVICES_OVERRIDE:-}
      - XML_ROOT=/xml
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:50080,http://127.0.0.1:50080}
    ports:
      # Backend хранит токен/сертификат в памяти процесса и рассчитан на одного
      # оператора. По умолчанию он доступен только с локальной машины.
      - "127.0.0.1:${API_PORT:-55000}:5000"
    restart: always

  frontend:
    image: api-gosuslugi-client
    build:
      context: ./api-gosuslugi-client
      dockerfile: ./Dockerfile
      args:
        progress: plain
        BACKEND_URL: "${BACKEND_URL:-/api}"
    container_name: react-nginx
    environment:
      - BACKEND_API=${BACKEND_API:-http://api:5000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-50080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: always
