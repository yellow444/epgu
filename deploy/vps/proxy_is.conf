# Общие настройки проксирования для /is и /push.
# Кладётся в /etc/nginx/proxy_is.conf и подключается из server-блока.

proxy_http_version 1.1;
proxy_set_header Host $host;
# Настоящий адрес отправителя. На стенде этот прокси должен быть перечислен в
# INBOUND_TRUSTED_PROXIES, иначе приёмник запишет адрес прокси, а не ЕПГУ.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
