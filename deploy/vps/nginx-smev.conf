# Внешний адрес информационной системы: два пути и ничего больше.
#
# Ставится на VPS, где живут домен и сертификат. Стенд доступен через туннель
# на 127.0.0.1:58080, поэтому наружу смотрит только этот файл.
#
# Подставьте свой домен, положите файл в /etc/nginx/sites-available и
# выпустите сертификат: certbot --nginx -d smev.example.ru

server {
    listen 80;
    server_name smev.example.ru;
    # Всё, кроме проверки certbot, уводим на https: техпортал ходит только туда.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name smev.example.ru;

    ssl_certificate     /etc/letsencrypt/live/smev.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smev.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Тело push сообщения бывает крупным, но не безразмерным: у приёмника свой
    # предел, и отдавать ему заведомо лишнее незачем.
    client_max_body_size 2m;
    server_tokens off;

    access_log /var/log/nginx/smev-access.log;
    error_log  /var/log/nginx/smev-error.log;

    # URL системы и URL push из карточки ИС в техпортале.
    location = /is    { proxy_pass http://127.0.0.1:58080/is; include /etc/nginx/proxy_is.conf; }
    location = /push  { proxy_pass http://127.0.0.1:58080/push; include /etc/nginx/proxy_is.conf; }

    # Всё остальное наружу не отдаём: операторские методы стенда сюда не
    # проксируются вообще, они слушают localhost на другой машине.
    location / { return 404; }
}
